:root[data-theme='dark']{--paper:#111316;--card:#181b1f;--ink:#e8eaed;--muted:#9aa0a6;--line:#2c3036;--soft:#1c2025;--blue:#8ab4f8;--red:#f28b82;--green:#81c995;--yel:#fdd663;--note:#2d2a1c}

{id:'cover',type:'cover',sk:'cover'},
{id:'two-knobs',kick:'1 · The idea',title:'Parameters store knowledge; depth does the reasoning',
 idea:'A normal transformer gets <mark>a fixed number of steps per token</mark>. Anything that needs more steps has to be written out as visible reasoning.',
 pts:['<b>Width and experts</b> hold facts and skills.','<b>Depth</b> is how many steps run one after another for each token.','<b>Looping</b> adds depth without adding new weights.'],
 hook:'Bigger memory and longer thinking are different things.',ask:'Name a task that is mostly recall, and one that is a long chain of steps.',sk:'knobs'},
{id:'unroll',kick:'2 · The idea',title:'Run the same core layers k times',
 idea:'Split the stack into a <mark>prelude</mark> (first layers: turn tokens into ideas), a <mark>core</mark> (middle layers: the thinking) and a <mark>coda</mark> (last layers: turn ideas back into the next token). Only the core repeats, using the same weights every pass.',
 pts:['<b>Inkling 2 Mini</b>: 6 + 3×12 + 6 = 48 layer runs from 24 stored layers.','<b>GLM-5.4</b>: 26 + 2×28 + 24 = 106 runs from 78 stored layers.','<b>Memory</b> holds one copy of the core; compute pays for every pass.'],
 hook:'Same weights, more passes.',ask:'If k doubles, what grows, and what stays the same?',sk:'unroll'},
{id:'lineage',kick:'3 · The idea',title:'An old idea that reached production in 2026',
 idea:'Sharing weights across depth dates to 2018. In November 2026 <mark>two labs shipped looped models</mark> at very different sizes.',
 pts:['<b>Small scale</b>: looped models trained from scratch saved parameters but lagged at equal compute.','<b>Inkling 2 Mini</b>: 26.4B total, local-sized, open weights.','<b>GLM-5.4</b>: 750B flagship; Z.ai says it reasons like 2–3T models.'],
 hook:'Same trick, a laptop model and a 750B one.',ask:'Why might looping matter more for small models than for big ones?',sk:'timeline'},
{id:'loop-the-middle',kick:'4 · Anatomy',title:'Loop the middle, not the ends',
 idea:'The first and last layers mostly <mark>translate between tokens and internal ideas</mark>; the middle does the abstract work.',
 pts:['<b>Inkling test</b>: looping the middle beat looping the last 12 layers on 27 of 28 evals.','<b>Compute-equivalent gain</b>: a no-loop model would need 1.51–1.91× the training compute to match a middle loop’s loss, but only 1.24–1.36× to match an end loop.','<b>Both models</b> loop a middle block: layers 7–18 and 27–54.'],
 hook:'Translate once, think several times.',ask:'What would looping the first layers repeat?',sk:'middle'},
{id:'two-designs',type:'compare',kick:'5 · Anatomy',title:'Two looped models side by side',
 rows:[['Total params','750B','26.4B (3.4B active)'],['Stored layers','78','24'],['Looped core','27–54 (28 layers)','7–18 (12 layers)'],['Passes','2','3'],['Layer runs per token','106','48'],['Gate (how much each pass writes back; page 7)','per token, per pass','learned, on the message'],['Memory trick','shared KV + 128-token window','20 local, 4 global layers'],['How it got a loop','retrofit + continued training','loop during training, pruned experts']],
 hook:'Same shape, different sizes and tricks.',ask:'Which differences come from size, and which from design choice?',sk:'compare'},
{id:'blow-up',kick:'6 · Stability',title:'Naive looping makes activations blow up',

 pts:['<b>GLM-5.4</b> hit this when it turned trained middle layers into a loop.','<b>Downstream layers</b> expect a familiar scale and distribution.','<b>Fix</b>: write updates back in measured doses.'],
 hook:'Feedback squeals when nothing turns it down.',ask:'Where else does feeding output back in cause runaway growth?',sk:'blowup'},
{id:'gates',kick:'7 · Stability',title:'A gate decides how much each pass writes',
 idea:'Each pass proposes h. A learned gate <mark>moves the state only a fraction β</mark> of the way toward it.',
 pts:['<b>GLM-5.4</b>: a separate gate per token and per pass; pass 1 learns small β, pass 2 large.','<b>Hard tokens</b>: pass 1 writes more, so they get more refinement.','<b>Inkling</b>: a low-rank learned gate (rank 64) on the message from the last pass.'],
 hook:'A dimmer, not a light switch.',ask:'What goes wrong if β is always 1? Always 0?',sk:'gate'},
{id:'message',kick:'8 · Stability',title:'Every pass re-reads the brief and gets the last pass’s notes',

 pts:['<b>Attention residuals</b>: layers mix earlier blocks’ outputs instead of one running sum.','<b>The brief</b>: the prelude output feeds every pass, so context isn’t lost.','<b>The message</b>: passes 2 and 3 also read the previous pass’s core output.'],
 hook:'Keep the brief, pass the notes.',ask:'Why re-read the original input on every pass?',sk:'relay'},
{id:'two-routes',kick:'9 · Training',title:'Two ways to get a looped model',

{id:'cost',kick:'10 · Training',title:'A little more training buys a lot of inference',

{id:'compute',kick:'12 · Serving',title:'Shared weights are not free compute',

    var b=el('button','btn pri','Start');b.addEventListener('click',function(){go(1)});t.appendChild(b);s.appendChild(t);
  }else if(p.type==='recap'){
    s.classList.add('recap');var t=el('div','txt');t.appendChild(el('h2',null,p.title));
    var g=el('div','thumbs');
    PAGES.forEach(function(q,j){if(!q.sk||q.type==='cover')return;var b=el('button','thumb');var sv=sketch(SK[q.sk]);sv.setAttribute('aria-hidden','true');b.appendChild(sv);b.appendChild(el('span',null,'<b>'+q.kick.split(' · ')[0]+'.</b> '+q.hook));b.addEventListener('click',function(){go(j)});g.appendChild(b)});
    t.appendChild(g);s.appendChild(t);
  }else{
    var f=el('div','fig');var sv=sketch(SK[p.sk]);sv.setAttribute('aria-label','Diagram: '+p.title);f.appendChild(sv);s.appendChild(f);
    var t=el('div','txt');t.appendChild(el('p','kick',p.kick));t.appendChild(el('h2',null,p.title));
    if(p.idea)t.appendChild(el('p','idea',p.idea));
    if(p.pts){var u=el('ul','pts');p.pts.forEach(function(x){u.appendChild(el('li',null,x))});t.appendChild(u)}
    if(p.rows){var tb='<thead><tr><th></th><th>GLM-5.4</th><th>Inkling 2 Mini</th></tr></thead><tbody>'+p.rows.map(function(r){return '<tr><th scope="row">'+r[0]+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join('')+'</tbody>';t.appendChild(el('table','cmp',tb))}
    if(p.items){var u=el('ul','traps');p.items.forEach(function(x){u.appendChild(el('li',null,'<b>'+x[0]+'</b> · '+x[1]+'<br><span class="way">→ '+x[2]+'</span>'))});t.appendChild(u)}
    t.appendChild(el('div','hook',p.hook));
    t.appendChild(el('p','ask','<b>Ask the room:</b> '+p.ask));
    s.appendChild(t);
  }
  stage.appendChild(s);secs.push(s);
  var d=el('button','dot','<i></i>');d.setAttribute('aria-label','Go to page '+(i+1));d.addEventListener('click',function(){go(i)});dots.appendChild(d);
});
var cur=-1,prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
function go(i,fromHash){i=Math.max(0,Math.min(PAGES.length-1,i));if(i===cur)return;cur=i;
  secs.forEach(function(s,j){s.hidden=j!==i});
  [].forEach.call(dots.children,function(d,j){if(j===i)d.setAttribute('aria-current','page');else d.removeAttribute('aria-current')});
  prev.disabled=i===0;next.disabled=i===PAGES.length-1;count.textContent=(i+1)+' / '+PAGES.length;stage.scrollTop=0;
  if(!fromHash&&location.hash.slice(1)!==PAGES[i].id){try{history.replaceState(null,'','#'+PAGES[i].id)}catch(e){location.hash=PAGES[i].id}}}
function fromHash(){var h=location.hash.slice(1),k=PAGES.findIndex(function(p){return p.id===h});go(k<0?0:k,true)}
prev.addEventListener('click',function(){go(cur-1)});next.addEventListener('click',function(){go(cur+1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1)});
var sx=null,sy=null;stage.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));sx=null},{passive:true});
window.addEventListener('hashchange',fromHash);
window.SKETCH_PAGES=PAGES.map(function(p){return p.id});
fromHash();

/* ---------- light / dark toggle ---------- */
(function(){
  var root=document.documentElement,tb=document.getElementById('theme'),mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':!!(mq&&mq.matches)}
  function paint(){var d=dark();tb.innerHTML=d?SUN:MOON;tb.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');tb.title=tb.getAttribute('aria-label')}
  try{var s=localStorage.getItem('theme');if(s==='dark'||s==='light')root.setAttribute('data-theme',s)}catch(e){}
  tb.addEventListener('click',function(){var t=dark()?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}paint()});
  if(mq&&mq.addEventListener)mq.addEventListener('change',paint);
  new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme']});
  paint();
})();
}
</script>
