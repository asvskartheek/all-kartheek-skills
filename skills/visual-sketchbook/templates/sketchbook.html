<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop Transformer Sketchbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly teacher's sketchbook
   IDEA: a hand-drawn booklet, one idea per taped page
   PICTURE: one original rough.js scene per idea
   COLOUR and TYPE: paper + blue ink, orange/pink accents; Kalam + Patrick Hand
   LAYOUT: sketch left, text right; one column under 820px */
:root{--paper:#fbf8f0;--card:#ffffff;--ink:#22303f;--muted:#5d6876;--line:#d9d2c0;--blue:#2f6fb3;--orange:#e07b28;--green:#3f9b5a;--pink:#d64f7c;--yel:#f6d24a;--hl:#ffe36e;--tape:rgba(214,200,160,.6);--wash:.42;--note:#fff1a8;--noteink:#2a2a20}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--paper:#1e2925;--card:#25332e;--ink:#eef0e6;--muted:#a9b5ad;--line:#3c4c45;--blue:#7fb6ee;--orange:#f3a25c;--green:#7fd096;--pink:#f08bad;--yel:#f3d86a;--hl:#8a7a26;--tape:rgba(230,225,200,.22);--wash:.3;--note:#efe29a;--noteink:#23231a}}
:root[data-theme='dark']{--paper:#1e2925;--card:#25332e;--ink:#eef0e6;--muted:#a9b5ad;--line:#3c4c45;--blue:#7fb6ee;--orange:#f3a25c;--green:#7fd096;--pink:#f08bad;--yel:#f3d86a;--hl:#8a7a26;--tape:rgba(230,225,200,.22);--wash:.3;--note:#efe29a;--noteink:#23231a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.45 'Patrick Hand',system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}
.wash{opacity:var(--wash);filter:url(#wc)}.mark{opacity:.55}
svg text{font-family:Kalam,cursive;fill:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px dashed var(--line)}
.bar .t{min-width:0;flex:1 1 0;font:700 20px Kalam,cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font:16px Kalam,cursive;color:var(--muted);white-space:nowrap}
.btn{font:700 17px Kalam,cursive;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:255px 18px 225px 16px/16px 225px 18px 255px;padding:8px 16px;min-height:44px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.btn.icon{display:inline-grid;place-items:center;padding:0;width:44px}.btn.icon svg{width:20px;height:20px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:focus-visible,.thumb:focus-visible,.dot:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.btn[disabled]{opacity:.35;cursor:default}
.stage{overflow:auto;overscroll-behavior:contain}
.page{max-width:1200px;margin:0 auto;padding:28px 24px 36px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:44px;align-items:center;min-height:100%}
.page[hidden]{display:none}
.card{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:255px 18px 225px 16px/16px 225px 18px 255px;padding:14px;box-shadow:7px 8px 0 var(--line);transform:rotate(-.8deg)}
.page.alt .card{transform:rotate(.9deg)}
.card::before,.card::after{content:'';position:absolute;width:92px;height:26px;background:var(--tape);top:-12px}
.card::before{left:12%;transform:rotate(-5deg)}.card::after{right:12%;transform:rotate(6deg)}
.card svg{display:block;width:100%;height:auto}
.kick{font:700 16px Kalam,cursive;color:var(--orange);margin:0 0 4px}
h1,h2{font-family:Kalam,cursive;font-weight:700;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5vw,54px)}h2{font-size:clamp(26px,3.2vw,36px)}
.ul{display:block;width:min(320px,80%);height:16px;margin:2px 0 12px}
.idea{font-size:21px;margin:0 0 12px}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 90%,transparent 90%);color:inherit;padding:0 2px}
.pts{list-style:none;padding:0;margin:0 0 16px}
.pts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;margin:5px 0;align-items:start}
.pts li svg{width:22px;height:22px;margin-top:3px}
.hook{position:relative;display:inline-block;background:var(--note);color:var(--noteink);font:700 19px Kalam,cursive;padding:12px 18px 10px;transform:rotate(-1.6deg);box-shadow:3px 4px 0 rgba(0,0,0,.14);margin:4px 0 16px;max-width:100%}
.hook::before{content:'';position:absolute;left:50%;top:-11px;width:70px;height:20px;margin-left:-35px;background:var(--tape);transform:rotate(3deg)}
.ask{border:2px dashed var(--blue);border-radius:16px 225px 16px 255px/255px 16px 225px 18px;padding:10px 14px}
.ask b{font-family:Kalam,cursive;color:var(--blue)}
.cover h1{margin-bottom:10px}
.credit{color:var(--muted);margin:0 0 18px}
.traps{display:grid;gap:10px;margin:6px 0 14px;padding:0;list-style:none}

.traps b{font-family:Kalam,cursive;color:var(--pink)}
.traps .way{color:var(--green)}
.recap{grid-template-columns:minmax(0,1fr);align-items:start}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.thumb{font:16px/1.3 'Patrick Hand',sans-serif;color:var(--ink);text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:255px 18px 225px 16px/16px 225px 18px 255px;padding:8px 10px 10px;cursor:pointer}
.thumb svg{width:100%;height:auto;display:block}
.thumb span{display:block;margin-top:4px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;border-top:2px dashed var(--line);font-size:14px;color:var(--muted)}
.foot .src{flex:1 1 320px}
.foot a{color:var(--blue)}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dot{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dot i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.dot[aria-current] i{background:var(--orange);border-color:var(--orange);transform:scale(1.3)}
@media(max-width:820px){.page{grid-template-columns:minmax(0,1fr);gap:22px;padding:22px 16px 30px;align-items:start}.idea{font-size:19px}body{font-size:18px}.dots{display:none}.foot{font-size:12px;padding:6px 16px}}
@media(max-width:480px){.bar .btn{padding:8px 11px}.count{display:none}}
@media(prefers-reduced-motion:no-preference){.page:not([hidden]) .card{animation:pop .35s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px) rotate(-.8deg)}}}
</style>
</head>

/* ---------- render ---------- */
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function deco(fn,seed,vb,cls){var s=sketch(fn,seed,vb);s.setAttribute('aria-hidden','true');s.removeAttribute('role');if(cls)s.setAttribute('class',cls);return s}
function underline(seed){return deco(function(A){A.L(4,8,296,6,{c:YEL,w:9,rough:1.2})},seed,'0 0 300 14','ul')}
function bullet(seed){return deco(function(A){A.star(12,12,10,ORANGE)},seed,'0 0 24 24')}
var stage=document.getElementById('stage'),dots=document.getElementById('dots'),secs=[];
PAGES.forEach(function(p,i){
  var s=el('section','page'+(i%2?' alt':''));s.id=p.id;s.hidden=true;s.setAttribute('aria-label','Page '+(i+1));
  if(p.type==='cover'){
    var c=el('div','card');var sv=sketch(SK.cover,1);sv.setAttribute('aria-label','A stack of layers where the middle three are looped twice, and a person cheering');c.appendChild(sv);s.appendChild(c);
    var t=el('div','txt');t.appendChild(el('p','kick','GLM-5.4 · Z.ai'));t.appendChild(el('h1',null,'The Loop Transformer, sketched'));t.appendChild(underline(99));
    t.appendChild(el('p','credit','An unofficial visual companion to Z.ai’s post “GLM-5.4: Toward Generalized Coding with Our First Loop Transformer”. Read the post for the full story.'));
    var b=el('button','btn','Start →');b.addEventListener('click',function(){go(1)});t.appendChild(b);s.appendChild(t);
  }else if(p.type==='recap'){
    s.classList.add('recap');var t=el('div','txt');t.appendChild(el('h2',null,p.title));t.appendChild(underline(98));
    var g=el('div','thumbs');
    PAGES.forEach(function(q,j){if(!q.sk||q.type==='cover')return;var b=el('button','thumb');var sv=sketch(SK[q.sk],j+1);sv.setAttribute('aria-hidden','true');b.appendChild(sv);b.appendChild(el('span',null,'<b>'+q.kick.split(' · ')[0]+'.</b> '+q.hook));b.addEventListener('click',function(){go(j)});g.appendChild(b)});
    t.appendChild(g);s.appendChild(t);
  }else{
    var c=el('div','card');var sv=sketch(SK[p.sk],i+1);sv.setAttribute('aria-label','Sketch: '+p.hook);c.appendChild(sv);s.appendChild(c);
    var t=el('div','txt');t.appendChild(el('p','kick',p.kick));t.appendChild(el('h2',null,p.title));t.appendChild(underline(i+40));
    if(p.idea)t.appendChild(el('p','idea',p.idea));
    if(p.pts){var u=el('ul','pts');p.pts.forEach(function(x,k){var li=el('li');li.appendChild(bullet(i*10+k));li.appendChild(el('span',null,x));u.appendChild(li)});t.appendChild(u)}
    if(p.items){var u=el('ul','traps');p.items.forEach(function(x){u.appendChild(el('li',null,'<b>'+x[0]+'</b> · '+x[1]+'<br><span class="way">→ '+x[2]+'</span>'))});t.appendChild(u)}
    t.appendChild(el('div','hook',p.hook));
    t.appendChild(el('p','ask','<b>Ask the room:</b> '+p.ask));
    s.appendChild(t);
  }
  stage.appendChild(s);secs.push(s);
  var d=el('button','dot','<i></i>');d.setAttribute('aria-label','Go to page '+(i+1));d.addEventListener('click',function(){go(i)});dots.appendChild(d);
});
var cur=-1,prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
function go(i,fromHash){i=Math.max(0,Math.min(PAGES.length-1,i));if(i===cur)return;cur=i;
  secs.forEach(function(s,j){s.hidden=j!==i});
  [].forEach.call(dots.children,function(d,j){if(j===i)d.setAttribute('aria-current','page');else d.removeAttribute('aria-current')});
  prev.disabled=i===0;next.disabled=i===PAGES.length-1;count.textContent=(i+1)+' / '+PAGES.length;stage.scrollTop=0;
  if(!fromHash&&location.hash.slice(1)!==PAGES[i].id){try{history.replaceState(null,'','#'+PAGES[i].id)}catch(e){location.hash=PAGES[i].id}}}
function fromHash(){var h=location.hash.slice(1),k=PAGES.findIndex(function(p){return p.id===h});go(k<0?0:k,true)}
prev.addEventListener('click',function(){go(cur-1)});next.addEventListener('click',function(){go(cur+1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1)});
var sx=null,sy=null;stage.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));sx=null},{passive:true});
window.addEventListener('hashchange',fromHash);
window.SKETCH_PAGES=PAGES.map(function(p){return p.id});
fromHash();

/* ---------- light / dark toggle ---------- */
(function(){
  var root=document.documentElement,tb=document.getElementById('theme'),mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':!!(mq&&mq.matches)}
  function paint(){var d=dark();tb.innerHTML=d?SUN:MOON;tb.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');tb.title=tb.getAttribute('aria-label')}
  try{var s=localStorage.getItem('theme');if(s==='dark'||s==='light')root.setAttribute('data-theme',s)}catch(e){}
  tb.addEventListener('click',function(){var t=dark()?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}paint()});
  if(mq&&mq.addEventListener)mq.addEventListener('change',paint);
  new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme']});
  paint();
})();
}
</script>
